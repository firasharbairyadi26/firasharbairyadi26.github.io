<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="dashboard">

    <!-- TOP BAR (theme + name) -->
    <div class="top-bar">
      <button class="btn-icon" id="nameBtn" title="Set your name">👤</button>
      <button class="btn-icon" id="themeToggle" title="Toggle dark mode">🌙</button>
    </div>

    <!-- ── GREETING CARD ── -->
    <div class="card greeting-card">
      <div class="clock"  id="clock">00:00:00</div>
      <div class="date"   id="date"></div>
      <div class="greeting-text" id="greeting"></div>
    </div>

    <!-- ── GRID: TIMER + TASKS ── -->
    <div class="grid">

      <!-- Focus Timer -->
      <div class="card timer-card">
        <div class="section-title">⏱ Focus Timer</div>
        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="timer-controls">
          <button class="btn btn-primary" id="startBtn">Start</button>
          <button class="btn btn-secondary" id="stopBtn">Stop</button>
          <button class="btn btn-secondary" id="resetBtn">Reset</button>
        </div>

        <!-- Challenge: Change Pomodoro Time -->
        <div class="timer-duration">
          <label for="durationInput">Duration (min):</label>
          <input type="number" id="durationInput" min="1" max="180" value="25" />
        </div>

        <div class="timer-progress">
          <div class="timer-progress-bar" id="timerProgressBar"></div>
        </div>
      </div>

      <!-- To-Do List -->
      <div class="card">
        <div class="section-title">✅ Tasks</div>

        <div class="task-input-row">
          <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="120" />
          <button class="btn btn-primary" id="addTaskBtn">Add</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
      </div>

    </div><!-- /grid -->

    <!-- ── QUICK LINKS ── -->
    <div class="card">
      <div class="section-title">🔗 Quick Links</div>

      <div class="link-input-row">
        <input type="text"  id="linkName" placeholder="Link name"      maxlength="30" />
        <input type="text"  id="linkUrl"  placeholder="URL (e.g. google.com)" maxlength="300" />
        <button class="btn btn-primary" id="addLinkBtn">Add Link</button>
      </div>

      <div class="links-grid" id="linksGrid"></div>
    </div>

  </div><!-- /dashboard -->

  <!-- ── NAME MODAL ── -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>👤 Your Name</h2>
      <p>Enter your name to personalise your greeting.</p>
      <input type="text" id="nameInputModal" placeholder="e.g. Alex" maxlength="40" />
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelNameBtn">Cancel</button>
        <button class="btn btn-primary"   id="saveNameBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- ── TOAST ── -->
  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
